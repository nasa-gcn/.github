name: Build and test Node.js

on:
  workflow_call:
    inputs:
      test-options:
        description: Arguments to pass to test runner
        default: --coverage
        required: false
        type: string
      docker:
        description: Set to true if Docker is required
        default: false
        type: boolean
        required: false
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token
        required: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - id: matrix
        uses: nasa-gcn/node-auto-matrix@7a29907973b834a998c4bb818050d2b992358ae0  # v1.2.0
        with:
          runner-macos: macos-15-intel  # FIXME: https://github.com/nasa-gcn/setup-docker currently requires an Intel runner
    outputs:
      nodeVersion: ${{ steps.matrix.outputs.nodeVersion }}
      runsOn: ${{ steps.matrix.outputs.runsOn }}
  build:
    needs: matrix
    strategy:
      matrix:
        nodeVersion: ${{ fromJson(needs.matrix.outputs.nodeVersion) }}
        runsOn: ${{ fromJson(needs.matrix.outputs.runsOn) }}
    runs-on: ${{ matrix.runsOn }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: Set up Docker
        if: inputs.docker
        uses: nasa-gcn/setup-docker@v1.0.0
      - name: NPM Install
        run: npm ci
      - name: Run eslint linter
        run: npx eslint --max-warnings 0 .
      - name: Run TypeScript compiler
        run: npx tsc
        # Skip if there is no tsconfig.json file
        if: hashFiles('tsconfig.json') != ''
      - name: Run Prettier code style checks
        run: npx prettier -c .
        # Skip prettier checks on Windows due to line endings.
        # See https://prettier.io/docs/en/options.html#end-of-line
        if: ${{ runner.os != 'Windows' }}
      - name: Run unit tests
        run: npm test --if-present -- ${{ inputs.test-options }}
      - name: Upload to Codecov.io
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v5.0.0-beta
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
